# Exp 3 / Stage S: AON input from one AON of the base network with base demand (no AON per scenario),
# plus the flow the closed links carry in it as two node features (displaced out / in).
model: aon_gnn
network: Berlin-Friedrichshain
dataset: main
seed: 44
device: cpu
threads: 12
epochs: 60
batch_size: 32
lr: 0.001
weight_decay: 0.0001
grad_clip: 1.0
model_args:
  hidden: 128
  layers: 8
  dropout: 0.0
  aon_input: base
name: main_aon_base_s44
