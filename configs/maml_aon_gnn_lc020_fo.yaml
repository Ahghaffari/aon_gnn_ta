# inner_lr 0.03 (not 0.1): with 0.1 first-order MAML diverged on this few tasks (run 2026-10-13: inner loop unstable from
# outer step ~25, NaN by step 50-100; the curvature term that second-order MAML keeps is missing). See PLAN.md Stage M1.
model: aon_gnn
network: Berlin-Friedrichshain
dataset: main
seed: 42
device: cpu
threads: 12
lr: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
model_args:
  hidden: 128
  layers: 8
  dropout: 0.0
meta_steps: 2000
val_points: 40
eval_k:
- 0
- 1
- 2
- 4
train_closure_sets: 20
init: runs/aon_gnn/20261002_144533_lc020
maml:
  k: 4
  m: 6
  tasks_per_step: 8
  inner_steps: 5
  inner_lr: 0.03
  scope: all
  first_order: true
name: maml_lc020_fo
