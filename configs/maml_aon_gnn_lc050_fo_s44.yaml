# inner_lr 0.03 (not 0.1): with 0.1 this seed diverged (run 2026-10-13, meta loss ~1e22 by outer step 300, every later step
# skipped; seeds 42 / 43 were stable at 0.1). Same fix as lc005_fo / lc020_fo. See PLAN.md Stage M1.
model: aon_gnn
network: Berlin-Friedrichshain
dataset: main
seed: 44
device: cpu
threads: 12
lr: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
model_args:
  hidden: 128
  layers: 8
  dropout: 0.0
meta_steps: 2000
val_points: 40
eval_k:
- 0
- 1
- 2
- 4
train_closure_sets: 50
init: runs/aon_gnn/20261013_194028_lc050_s44
maml:
  k: 4
  m: 6
  tasks_per_step: 8
  inner_steps: 5
  inner_lr: 0.03
  scope: all
  first_order: true
name: maml_lc050_fo_s44
